<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualités et agenda — Université de Tlemcen</title>
<meta name="description" content="Conférences, colloques, journées portes ouvertes, résultats et avis de l'Université de Tlemcen.">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.layout{display:grid;grid-template-columns:1fr 340px;gap:clamp(20px,3vw,40px);align-items:start;padding-top:clamp(40px,6vw,72px)}
@media (max-width:980px){ .layout{grid-template-columns:1fr} }
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.active-filter{display:none;align-items:center;gap:10px;margin:12px 0;font-weight:600;color:var(--emerald)}
.active-filter.on{display:flex}
.active-filter button{all:unset;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:99px;background:var(--sand)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
@media (max-width:640px){ .grid{grid-template-columns:1fr} }
.post{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s;animation:cIn .45s var(--ease) both}
@keyframes cIn{from{opacity:0;transform:translateY(10px)}}
.post:hover{transform:translateY(-5px);box-shadow:0 30px 60px -40px rgba(13,74,55,.55)}
.post:focus-visible{outline:3px solid var(--gold)}
.post .im{aspect-ratio:16/9;background:var(--emerald);overflow:hidden;position:relative}
.post .im img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.post:hover .im img{transform:scale(1.05)}
.post .im.noimg{display:grid;place-items:center;color:var(--gold-2);font:400 34px var(--serif)}
.post .bd{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.post .meta{display:flex;justify-content:space-between;gap:10px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--leaf)}
.post .meta time{color:var(--muted)}
.post b{font-size:18px;line-height:1.3}
.post p{margin:0;color:var(--muted);font-size:14px}
.post.big{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}
.post.big .im{aspect-ratio:auto;min-height:300px}
.post.big b{font:400 clamp(28px,3vw,40px)/1.05 var(--serif);color:var(--emerald)}
@media (max-width:640px){ .post.big{grid-template-columns:1fr} .post.big .im{min-height:200px} }

/* calendar */
.cal{position:sticky;top:110px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-h b{font:400 28px var(--serif);color:var(--emerald);text-transform:capitalize}
.cal-h button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.cal-h button:hover{border-color:var(--emerald)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;padding-bottom:6px}
.day{all:unset;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:500;position:relative;color:var(--ink)}
.day.out{visibility:hidden}
.day.ev{cursor:pointer;background:var(--sand);font-weight:700;color:var(--emerald)}
.day.ev::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.day.ev:hover{background:var(--gold);color:var(--emerald-2)}
.day.sel{background:var(--emerald)!important;color:#fff!important}
.day.today{box-shadow:inset 0 0 0 1.5px var(--leaf)}
.day:focus-visible{outline:2px solid var(--gold)}
.upcoming{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.upcoming h4{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.upcoming a{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 0;align-items:center}
.upcoming .d{background:var(--emerald);color:#fff;border-radius:10px;text-align:center;padding:4px 0;font:400 20px/1 var(--serif)}
.upcoming .d small{display:block;font:500 9px var(--mono);text-transform:uppercase;color:var(--gold-2)}
.upcoming span{font-size:14px;font-weight:600;line-height:1.3}
@media (max-width:980px){ .cal{position:static} }

/* article overlay */
.art-bg{position:fixed;inset:0;z-index:150;background:rgba(10,30,22,.6);backdrop-filter:blur(4px);display:none;overflow-y:auto;padding:5vh 16px}
.art-bg.open{display:block;animation:fadeIn .25s}
.art{max-width:820px;margin:0 auto;background:var(--paper);border-radius:28px;overflow:hidden;animation:pop .45s var(--ease)}
.art .im img{width:100%;max-height:420px;object-fit:cover}
.art .bd{padding:clamp(22px,4vw,44px)}
.art h2{font-size:clamp(32px,4.4vw,54px);color:var(--emerald);margin:12px 0 16px}
.art p{font-size:18px;color:var(--muted)}
.art .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.art .x{position:sticky;top:0;float:right;margin:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);cursor:pointer;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:2}
.art .src{font-size:13px;color:var(--muted);margin-top:18px}
.post,.cal,.art,.plat,.box,.addr,.tabs{border-radius:10px}
.tab,.tab[aria-selected="true"]{border-radius:6px}
.post b,.post.big b{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15}
.post.big b{font-size:clamp(30px,3.2vw,42px)}
.box h3,.cal-h b,.art h2{font-weight:600}
.addr{border-bottom:6px solid var(--gold)}
</style>
</head>
<body data-page="news">
<div id="site-header"></div>

<main id="main">
  <section class="phero">
    <svg class="pattern" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width=".6"><path d="M50 2 L98 50 L50 98 L2 50Z"/><path d="M50 14 L86 50 L50 86 L14 50Z"/><circle cx="50" cy="50" r="22"/></g></svg>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Accueil</a> / Actualités et agenda</div>
      <span class="kicker">Actualités</span>
      <h1>Ce qui se passe <em>à l'université.</em></h1>
      <p>Conférences internationales, colloques, journées portes ouvertes, résultats et avis officiels — filtrez, recherchez ou parcourez l'agenda.</p>
    </div>
  </section>

  <div class="wrap layout">
    <div>
      <div class="tools">
        <div class="field-search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="q" type="search" placeholder="Rechercher une actualité" aria-label="Rechercher une actualité"></div>
      </div>
      <div class="chips" id="cats" role="group" aria-label="Catégories"></div>
      <div class="active-filter" id="dayFilter"><span id="dayLabel"></span><button id="clearDay">Effacer ✕</button></div>
      <div class="grid" id="grid" aria-live="polite"></div>
    </div>
    <aside class="cal" aria-label="Agenda">
      <div class="cal-h"><button id="prevM" aria-label="Mois précédent">‹</button><b id="month"></b><button id="nextM" aria-label="Mois suivant">›</button></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="upcoming"><h4>Dates à retenir</h4><div id="upc"></div></div>
    </aside>
  </div>
</main>

<div class="art-bg" id="artBg" role="dialog" aria-modal="true" aria-labelledby="artTitle"><article class="art" id="art"></article></div>

<div id="site-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const N = UT.news.slice().sort((a, b) => (b.date || '0').localeCompare(a.date || '0'));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const fmt = (d, o = { day: 'numeric', month: 'long', year: 'numeric' }) => new Date(d + 'T12:00').toLocaleDateString('fr-FR', o);
  const cats = ['Toutes', ...new Set(N.map(n => n.cat))];
  let cat = 'Toutes', day = null;

  function renderCats() { $('#cats').innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === cat}" data-c="${c}">${c}<span>${c === 'Toutes' ? N.length : N.filter(n => n.cat === c).length}</span></button>`).join(''); }
  function render() {
    const q = norm($('#q').value.trim());
    const list = N.filter(n => (cat === 'Toutes' || n.cat === cat) && (!day || n.date === day) && (!q || norm(n.t + ' ' + n.d + ' ' + n.cat).includes(q)));
    $('#dayFilter').classList.toggle('on', !!day);
    if (day) $('#dayLabel').textContent = 'Le ' + fmt(day);
    $('#grid').innerHTML = list.length ? list.map((n, i) => `<button class="post${i === 0 && !q && !day && n.img ? ' big' : ''}" data-id="${n.id}" style="animation-delay:${i * 40}ms">
        <span class="im${n.img ? '' : ' noimg'}">${n.img ? `<img src="assets/img/${n.img}" alt="" loading="lazy">` : 'Avis'}</span>
        <span class="bd"><span class="meta"><span>${n.cat}</span><time>${n.date ? fmt(n.date, { day: 'numeric', month: 'short' }) : 'Récemment'}</time></span><b>${n.t}</b><p>${n.d}</p></span>
      </button>`).join('') : '<div class="empty" style="grid-column:1/-1">Aucune actualité ne correspond à votre recherche.</div>';
  }
  $('#cats').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; cat = b.dataset.c; renderCats(); render(); };
  $('#q').oninput = render;
  $('#clearDay').onclick = () => { day = null; renderCal(); render(); };

  // calendar: starts on the month of the most recent dated item
  const dated = N.filter(n => n.date);
  let view = new Date((dated[0]?.date || new Date().toISOString().slice(0, 10)) + 'T12:00'); view.setDate(1);
  function renderCal() {
    const y = view.getFullYear(), m = view.getMonth();
    $('#month').textContent = view.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
    const evs = new Set(dated.map(n => n.date));
    const today = new Date().toISOString().slice(0, 10);
    let html = ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'].map(d => `<span class="dow">${d}</span>`).join('');
    for (let i = 0; i < first; i++) html += '<span class="day out"></span>';
    for (let d = 1; d <= days; d++) {
      const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const ev = evs.has(iso);
      html += ev ? `<button class="day ev${iso === day ? ' sel' : ''}${iso === today ? ' today' : ''}" data-d="${iso}" aria-label="${fmt(iso)} — voir les actualités">${d}</button>` : `<span class="day${iso === today ? ' today' : ''}">${d}</span>`;
    }
    $('#calGrid').innerHTML = html;
  }
  $('#calGrid').onclick = e => { const b = e.target.closest('.day.ev'); if (!b) return; day = day === b.dataset.d ? null : b.dataset.d; renderCal(); render(); };
  $('#prevM').onclick = () => { view.setMonth(view.getMonth() - 1); renderCal(); };
  $('#nextM').onclick = () => { view.setMonth(view.getMonth() + 1); renderCal(); };
  $('#upc').innerHTML = dated.slice(0, 4).map(n => `<a href="#${n.id}"><span class="d">${new Date(n.date + 'T12:00').getDate()}<small>${fmt(n.date, { month: 'short' })}</small></span><span>${n.t}</span></a>`).join('');

  // article overlay, deep-linkable with #id
  const bg = $('#artBg');
  function openArt(id) {
    const n = N.find(x => x.id === id); if (!n) return;
    $('#art').innerHTML = `<button class="x" id="artX" aria-label="Fermer">✕</button>${n.img ? `<div class="im"><img src="assets/img/${n.img}" alt=""></div>` : ''}
      <div class="bd"><span class="tag" style="font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;background:var(--gold);color:var(--emerald-2);padding:5px 9px;border-radius:6px">${n.cat}${n.date ? ' · ' + fmt(n.date) : ''}</span>
      <h2 id="artTitle">${n.t}</h2><p>${n.d}</p>
      <div class="acts"><button class="btn" id="share">Copier le lien</button>${n.date ? `<button class="btn ghost" id="ics" style="color:var(--emerald)">Ajouter à mon agenda</button>` : ''}</div>
      <p class="src">Résumé rédigé pour ce concept de refonte d'après l'actualité publiée sur le site officiel.</p></div>`;
    bg.classList.add('open'); document.body.style.overflow = 'hidden';
    $('#artX').onclick = closeArt; $('#artX').focus();
    $('#share').onclick = async () => { try { await navigator.clipboard.writeText(location.href.split('#')[0] + '#' + n.id); utToast('Lien copié'); } catch { utToast('Copie impossible'); } };
    const ics = $('#ics');
    if (ics) ics.onclick = () => {
      const d = n.date.replace(/-/g, '');
      const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UABT//Concept//FR', 'BEGIN:VEVENT', `UID:${n.id}@univ-tlemcen-concept`, `DTSTART;VALUE=DATE:${d}`, `SUMMARY:${n.t.replace(/[,;]/g, ' ')}`, 'LOCATION:Université de Tlemcen', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = `${n.id}.ics`; a.click(); URL.revokeObjectURL(a.href);
    };
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  }
  function closeArt() { bg.classList.remove('open'); document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); }
  bg.onclick = e => { if (e.target === bg) closeArt(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && bg.classList.contains('open')) closeArt(); });
  $('#grid').onclick = e => { const p = e.target.closest('.post'); if (p) openArt(p.dataset.id); };
  addEventListener('hashchange', () => openArt(location.hash.slice(1)));

  renderCats(); render(); renderCal();
  if (location.hash) openArt(location.hash.slice(1));
})();
</script>
</body>
</html>
